# Backtest q environment - sourced by all start scripts.
# Edit values below, then run ./run-seed.sh or ./run-hdb.sh.

# Prod kdb instance to pull seed data from (run-seed.sh)
export PROD_HOST="kdb-research.prod.b2c2.net"
export PROD_PORT="5188"

# Date range to seed (run-seed.sh). Format: yyyy.mm.dd
export START_DATE="2026.05.27"
export END_DATE="2026.05.28"

# Local HDB tree (run-seed.sh, run-hdb.sh)
export HDB_PATH="$HOME/data/kdb/hdb"

# Local CSV dump dir (run-dump-csv.sh)
export CSV_PATH="$HOME/data/csv"

# Port the long-lived HDB listens on (run-hdb.sh)
export KDB_PORT="5042"
